    75%  { background: #ff6600; }

}
h2 {
    font-size: 5vw;
    font-family: Arial, sans-serif;
    font-weight: bold;
    color: #000;
    text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff;
    animation: flash 0.3s infinite;
}
@keyframes flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}
</style>
