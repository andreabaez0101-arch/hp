<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>You are an idiot!</title>
<script src="you.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #ffffff; }
#container {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    animation: strobe 0.3s infinite;
}
@keyframes strobe {
    0%   { background: #ff0000; }
    25%  { background: #00ff00; }
    50%  { background: #0000ff; }
    75%  { background: #ffff00; }
    100% { background: #ff0000; }
}
h1 {
    font-size: 10vw;
    color: #000;
    text-shadow: 4px 4px 0 #fff, -4px -4px 0 #fff, 4px -4px 0 #fff, -4px 4px 0 #fff;
    animation: flashText 0.5s infinite;
}
@keyframes flashText {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}
.smiley {
    font-size: 15vw;
    animation: bounce 0.3s infinite alternate;
}
@keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-30px); }
}
audio { display: none; }
</style>
</head>
<body onunload="procreate()">

<div id="container">
    <div class="smiley">😊😡😊😡</div>
    <h1>YOU ARE AN IDIOT</h1>
    <div class="smiley">😡😊😡😊</div>
</div>

<script>
// Iniciar reproducción automática (requiere interacción del usuario en Chrome)
document.addEventListener('click', function() {
    var audio = document.getElementById('audioPlayer');
    if (audio) audio.play();
});
</script>

</body>
</html>
